name: Update dependencies

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Remove once tibdex/github-app-token ships Node.js 24 support

jobs:
  update:
    name: uv lock --upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate app token
        uses: tibdex/github-app-token@0af3325639c0a60612b2eeaf010f0f88e468e800  # v2.1.0
        id: app-token
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up environment
        uses: ./.github/actions/setup-env

      - name: Upgrade all dependencies
        run: uv lock --upgrade

      - name: Open pull request if lock file changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-deps
          commit-message: "chore: upgrade uv.lock"
          title: "chore: weekly dependency update"
          body: |
            Automated weekly dependency update via `uv lock --upgrade`.

            Review the `uv.lock` diff to see what changed.
          labels: dependencies
