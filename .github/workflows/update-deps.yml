name: Update dependencies

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read

jobs:
  update:
    name: uv lock --upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up environment
        uses: ./.github/actions/setup-env

      - name: Upgrade all dependencies
        run: uv lock --upgrade

      - name: Open pull request if lock file changed
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0  # v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-deps
          commit-message: "chore: upgrade uv.lock"
          title: "chore: weekly dependency update"
          body: |
            Automated weekly dependency update via `uv lock --upgrade`.

            Review the `uv.lock` diff to see what changed.
          labels: dependencies
