# This workflow automates the release process when a version tag is pushed.
#
# Flow:
#   1. Developer bumps version locally and pushes a vX.Y.Z tag
#   2. Quality gate runs on the tagged commit
#   3. Build wheel + sdist
#   4. Create GitHub release with git-cliff release notes
#   5. Publish to PyPI via trusted publishing
#
# Release steps:
#   uv version --bump patch|minor|major
#   git add pyproject.toml uv.lock
#   git commit -m "chore: bump version to X.Y.Z"
#   git tag vX.Y.Z
#   git push origin main vX.Y.Z

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip release and PyPI publish)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up environment
        uses: ./.github/actions/setup-env

      - name: Run ruff lint
        run: uv run ruff check src tests

      - name: Run ruff format check
        run: uv run ruff format --check src tests

      - name: Run pyright type checking
        run: uv run pyright src

      - name: Run tests
        run: uv run pytest --cov=sqlrepository --cov-report=term-missing

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up environment
        uses: ./.github/actions/setup-env

      - name: Build package
        run: uv build

      - name: Verify artifacts
        run: |
          ls -lh dist/
          echo "Built packages:"
          for f in dist/*; do echo "  - $(basename $f)"; done

      - name: Check distribution artifacts
        run: uv run twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: dist
          path: dist/
          retention-days: 7

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up environment
        uses: ./.github/actions/setup-env

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          git cliff --latest --output release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Release ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: create-release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    environment:
      name: pypi
      url: https://pypi.org/project/sqlrepository/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          print-hash: true
          verbose: true

  dry-run-summary:
    name: Dry Run Summary
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    steps:
      - name: Summary
        run: |
          echo "Dry run completed successfully!"
          echo ""
          echo "Checks passed and package built. Skipped: GitHub release and PyPI publish."
          echo ""
          echo "To release for real, push a version tag:"
          echo "  uv version --bump patch|minor|major"
          echo "  git add pyproject.toml uv.lock"
          echo "  git commit -m 'chore: bump version to X.Y.Z'"
          echo "  git tag vX.Y.Z"
          echo "  git push origin main vX.Y.Z"
